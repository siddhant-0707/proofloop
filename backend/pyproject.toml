[project]
name = "proofloop"
version = "0.1.0"
description = "ProofLoop: stress-tested hurricane response plans, verified against NISAR radar"
authors = [
    { name = "Siddhant Chauhan", email = "chauhanjoy10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "h5py>=3.16.0",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pyproj>=3.8.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
executionEnvironments = [
  # Tests read optional Transcript fields directly; a None there is a test failure anyway.
  { root = "tests", reportOptionalMemberAccess = false, reportOperatorIssue = false },
  { root = "src" },
]
